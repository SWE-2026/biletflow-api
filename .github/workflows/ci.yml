name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: biletflow
          POSTGRES_PASSWORD: biletflow
          POSTGRES_DB: biletflow_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U biletflow -d biletflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make check
      - run: go test -race -count=1 ./...
        env:
          TEST_DB_DSN: postgres://biletflow:biletflow@localhost:55433/biletflow_test?sslmode=disable
